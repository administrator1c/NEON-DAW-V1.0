name: Neon DAW - Extract ZIP and Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Neon DAW source ZIP
        shell: bash
        run: |
          set -euo pipefail
          if [ -f app/build.gradle ] && [ -f settings.gradle ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            ZIP=$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname '*NeonDAW*.zip' -print -quit)
            if [ -z "$ZIP" ]; then
              echo 'ERROR: Upload NeonDAW-Android-source.zip to repository root.'
              exit 1
            fi
            mkdir -p "$RUNNER_TEMP/neondaw"
            unzip -q "$ZIP" -d "$RUNNER_TEMP/neondaw"
            SETTINGS=$(find "$RUNNER_TEMP/neondaw" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
            if [ -z "$SETTINGS" ]; then
              echo 'ERROR: No Android settings.gradle found inside ZIP.'
              exit 1
            fi
            PROJECT_DIR=$(dirname "$SETTINGS")
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK" && test -d "$SDK" || { echo 'Android SDK missing'; exit 1; }
          SDKMANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -n "$SDKMANAGER" || { echo 'sdkmanager missing'; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonDAW-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
